[project]
name = "sheets-sync-engine"
version = "0.1.0"
description = "Python Google Sheets Sync Engine and Change Poller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gspread>=6.1.2",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
